name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-core.txt
            requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements-core.txt -r requirements.txt -r requirements-dev.txt
      - name: Testes
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: portfolio-planilhas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Subir o container e checar /health
        run: |
          docker run -d --name app -p 8000:8000 portfolio-planilhas:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
